<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简科技 - 首页</title>
    <style>
        /* —— 全局样式 —— */
        body {
            margin: 0;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            background-color: #f9f9f9;
            color: #333;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* —— 顶部导航 —— */
        header {
            background-color: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }
        .logo {
            font-size: 1.5em;
            font-weight: bold;
            color: #0078D7;
        }
        nav a {
            margin-left: 30px;
            font-size: 1em;
            transition: color 0.3s;
        }
        nav a:hover {
            color: #0078D7;
        }

        /* —— 主视觉 Banner —— */
        .hero {
            background: linear-gradient(to right, #0078D7, #00B4D8);
            color: #fff;
            text-align: center;
            padding: 120px 20px;
        }
        .hero h1 {
            font-size: 3em;
            margin-bottom: 10px;
        }
        .hero p {
            font-size: 1.2em;
            margin-bottom: 30px;
        }
        .hero .btn {
            background-color: #fff;
            color: #0078D7;
            padding: 12px 30px;
            border-radius: 4px;
            font-weight: bold;
            transition: 0.3s;
        }
        .hero .btn:hover {
            background-color: #e3e3e3;
        }

        /* —— 服务内容 —— */
        .services {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin: 80px 0;
            text-align: center;
        }
        .service-item {
            background: #fff;
            padding: 40px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: 0.3s;
        }
        .service-item:hover {
            transform: translateY(-5px);
        }
        .service-item h3 {
            color: #0078D7;
            margin-bottom: 15px;
        }

        /* —— 页脚 —— */
        footer {
            background-color: #1a1a1a;
            color: #aaa;
            padding: 40px 0;
            text-align: center;
        }
        footer p {
            margin: 5px 0;
        }
    </style>
</head>
<body>

    <!-- 顶部导航 -->
    <header>
        <div class="container nav">
            <div class="logo">极简科技</div>
            <nav>
                <a href="#">首页</a>
                <a href="#">关于我们</a>
                <a href="#">服务</a>
                <a href="#">案例</a>
                <a href="#">联系我们</a>
            </nav>
        </div>
    </header>

    <!-- 主视觉区域 -->
    <section class="hero">
        <h1>让科技助力您的未来</h1>
        <p>专注创新与品质 · 打造高效数字化解决方案</p>
        <a href="#" class="btn">了解更多</a>
    </section>

    <!-- 服务内容 -->
    <div class="container">
        <section class="services">
            <div class="service-item">
                <h3>品牌网站建设</h3>
                <p>我们为企业打造高端、美观且高效的响应式网站。</p>
            </div>
            <div class="service-item">
                <h3>移动端开发</h3>
                <p>完善的APP与小程序开发，让用户体验流畅自然。</p>
            </div>
            <div class="service-item">
                <h3>数字营销推广</h3>
                <p>整合营销方案，助力品牌获得更多曝光与转化。</p>
            </div>
        </section>
    </div>

    <!-- 页脚 -->
    <footer>
        <p>© 2024 极简科技有限公司 | 保留所有权利</p>
        <p>地址：北京市海淀区创新大道88号 | 电话：010-1234-5678</p>
    </footer>

</body>
</html>
